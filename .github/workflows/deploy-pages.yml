name: Deploy Luna to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://luna-backend-yc4e.onrender.com' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ANDROID_APP_URL: ./downloads/luna-android.apk

      - name: Sync Capacitor Android shell
        run: npx cap sync android

      - name: Build downloadable Android APK
        working-directory: android
        env:
          LUNA_UPLOAD_STORE_FILE: ${{ secrets.LUNA_UPLOAD_STORE_FILE || '' }}
          LUNA_UPLOAD_STORE_PASSWORD: ${{ secrets.LUNA_UPLOAD_STORE_PASSWORD || '' }}
          LUNA_UPLOAD_KEY_ALIAS: ${{ secrets.LUNA_UPLOAD_KEY_ALIAS || '' }}
          LUNA_UPLOAD_KEY_PASSWORD: ${{ secrets.LUNA_UPLOAD_KEY_PASSWORD || '' }}
          LUNA_VERSION_CODE: ${{ github.run_number }}
          LUNA_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleRelease

      - name: Attach APK to web build
        run: |
          mkdir -p dist/downloads
          cp android/app/build/outputs/apk/release/app-release.apk dist/downloads/luna-android.apk

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
