name: Android Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app for Android shell
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || '' }}
          VITE_ANDROID_APP_URL: ./downloads/luna-android.apk

      - name: Sync Capacitor Android shell
        run: npx cap sync android

      - name: Build release APK and bundle
        working-directory: android
        env:
          LUNA_UPLOAD_STORE_FILE: ${{ secrets.LUNA_UPLOAD_STORE_FILE || '' }}
          LUNA_UPLOAD_STORE_PASSWORD: ${{ secrets.LUNA_UPLOAD_STORE_PASSWORD || '' }}
          LUNA_UPLOAD_KEY_ALIAS: ${{ secrets.LUNA_UPLOAD_KEY_ALIAS || '' }}
          LUNA_UPLOAD_KEY_PASSWORD: ${{ secrets.LUNA_UPLOAD_KEY_PASSWORD || '' }}
          LUNA_VERSION_CODE: ${{ github.run_number }}
          LUNA_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
